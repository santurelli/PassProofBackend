# Quarkus HTTP configurations
quarkus.http.port=8080

# Database configurations (General)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Reactive PostgreSQL Client connection settings
quarkus.datasource.reactive.url=postgresql://localhost:5432/cyberpass
# Connection pool settings
quarkus.datasource.reactive.max-size=20

# JDBC configuration (Only used for Flyway migration, as Flyway is blocking JDBC-based)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cyberpass

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.0.0

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.cyberpass".level=DEBUG

# LangChain4j OpenAI / Custom Local & Private Cloud AI configuration
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo-key-change-me}
quarkus.langchain4j.openai.embedding-model.model-name=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.timeout=${OPENAI_TIMEOUT:60s}

# MFA Encryption configurations
# This is a base64-encoded 256-bit AES key used to encrypt TOTP secrets at rest.
passproof.mfa.encryption-key=dGhpcy1pcy1hLXNlY3VyZS1hZXMtMjU2LWtleS0zMmI=

# JWT Signing & Verification Configurations (HS256 via JWK)
smallrye.jwt.sign.key.location=jwt-secret.jwk
smallrye.jwt.verify.key.location=jwt-secret.jwk
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.publickey.location=jwt-secret.jwk
mp.jwt.verify.issuer=passproof-auth
mp.jwt.verify.algorithm=HS256

# MFA App Issuer Names
passproof.mfa.issuer=PassProof
%dev.passproof.mfa.issuer=PassProof DEV

# Email Dispatch Configuration (Simulation vs Production)
passproof.mail.simulation=${EMAIL_SIMULATION:true}
passproof.activation.base-url=${PASSPROOF_ACTIVATION_BASE_URL:http://localhost:5173}

# Contact Form Recipient Email
passproof.contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:pietro.santurelli@newsoftitalia.com}

# HTTP CORS Configurations (for console, public domain, and local development)
quarkus.http.cors=true
quarkus.http.cors.origins=https://console.passproof.app,https://www.passproof.app,https://passproof.app,http://localhost:5173,http://localhost:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
